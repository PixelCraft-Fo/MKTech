<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coșul de cumpărături | MKTech</title>
  <meta name="description" content="Coșul tău de cumpărături MKTech.">
  <meta name="theme-color" content="#0a1c3d">
  <link rel="icon" type="image/png" href="imagini/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cos">
  <div id="site-header"></div>
  <noscript><p class="noscript">Pentru a folosi magazinul MKTech, activează JavaScript în browser.</p></noscript>

  <!-- Conținutul coșului e generat din script.js (secțiunea 8.4).
       Produsele se țin în localStorage, iar comanda se trimite real:
       se salvează în Supabase și pleacă emailurile (vezi comanda-core.js). -->
  <main id="main" class="container">
    <div id="cart-root"></div>
  </main>

  <div id="site-footer"></div>

  <!-- Aceleași biblioteci ca pe contact.html: comanda din coș se salvează
       în Supabase și trimite emailurile prin EmailJS. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="comanda-core.js"></script>
</body>
</html>
