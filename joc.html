<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joacă și câștigă | MKTech</title>
  <meta name="description" content="Joacă mini-jocurile MKTech și câștigă cupoane de reducere: roata norocului, răzuiește și câștigă, mingea norocoasă.">
  <meta name="theme-color" content="#0a1c3d">
  <link rel="icon" type="image/png" href="imagini/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="joc">
  <div id="site-header"></div>
  <noscript><p class="noscript">Pentru a juca, activează JavaScript în browser.</p></noscript>

  <!-- Pagina de joc (aici ajung și cei care scanează codul QR de pe pliante).
       Jocurile sunt construite din joc.js; premiile și codurile sunt în cupoane.js. -->
  <main id="main" class="container">
    <header class="page-head game-head">
      <span class="eyebrow"><span data-icon="gift"></span> Reduceri pentru tine</span>
      <h1 class="page-title">Joacă și câștigă reduceri!</h1>
      <p class="page-subtitle">Ai 2 încercări, plus una nouă în fiecare zi. Alege un joc și vezi ce cupon câștigi.</p>
    </header>

    <div id="game-root"></div>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
  <script src="cupoane.js"></script>
  <script src="joc.js"></script>
</body>
</html>
