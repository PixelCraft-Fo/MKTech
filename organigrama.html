<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organigramă | MKTech</title>
  <meta name="description" content="Organigrama și structura organizatorică a firmei de exercițiu MKTech.">
  <meta name="theme-color" content="#0a1c3d">
  <link rel="icon" type="image/png" href="imagini/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="organigrama">
  <div id="site-header"></div>
  <noscript><p class="noscript">Pentru a folosi magazinul MKTech, activează JavaScript în browser.</p></noscript>

  <main id="main" class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="index.html">Acasă</a></li>
        <li><a href="despre.html">Despre noi</a></li>
        <li aria-current="page">Organigramă</li>
      </ol>
    </nav>

    <!-- Cele două organigrame, una lângă alta, fiecare cu titlul ei deasupra.
         Ordinea de mai jos (titlu, imagine, titlu, imagine) este și ordinea de pe telefon.
         Click pe oricare organigramă o deschide mărită.
         ROBERT: imagini/organigrama-echipa.png o adaugi tu (organigrama cu pozele colegilor);
         până atunci, în locul ei apare un bloc gri cu „Imagine în curând”. -->
    <section class="section org-section" aria-labelledby="org-title">
      <div class="org-pair">
        <div class="org-pair__head">
          <span class="eyebrow">Echipa</span>
          <h2 class="section-title" id="team-title">Oamenii din spatele MKTech</h2>
          <p class="section-subtitle">MKTech este condusă de o echipă de 28 de elevi ai clasei a XI-a A.</p>
        </div>
        <figure class="org-pair__item">
          <button class="org-pair__frame" type="button" data-zoom="imagini/organigrama-echipa.png"
            data-zoom-alt="Organigrama echipei MKTech cu membrii">
            <span class="org-pair__soon">Imagine în curând</span>
            <img src="imagini/organigrama-echipa.png" alt="Organigrama echipei MKTech cu membrii" loading="lazy" onerror="zoomImageFallback(this)">
          </button>
          <figcaption class="org-pair__caption">Organigrama echipei, cu membrii</figcaption>
        </figure>

        <div class="org-pair__head">
          <span class="eyebrow">Structura firmei</span>
          <h1 class="section-title" id="org-title">Organigramă</h1>
          <p class="section-subtitle">Echipa și structura organizatorică a firmei MKTech.</p>
        </div>
        <figure class="org-pair__item">
          <button class="org-pair__frame" type="button" data-zoom="imagini/organigrama.png"
            data-zoom-alt="Organigrama firmei MK Tech S.R.L.">
            <span class="org-pair__soon">Imagine în curând</span>
            <img src="imagini/organigrama.png" alt="Organigrama firmei MK Tech S.R.L." loading="lazy" onerror="zoomImageFallback(this)">
          </button>
          <figcaption class="org-pair__caption">Organigrama firmei MK Tech S.R.L.</figcaption>
        </figure>
      </div>

      <p class="org-pair__hint">Apasă pe o organigramă ca să o vezi mărită.</p>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
